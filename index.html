
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="container my-5">
        <div class="bg-light border rounded shadow p-4 mx-auto" style="max-width: 700px;">
            <div class="text-center">
                <i class="bi bi-cloud-sun-fill text-primary" style="font-size: 60px;"></i>
            </div>

            <h1 class="text-center text-primary mb-4">Weather App</h1>

            <div class="d-flex justify-content-center align-items-center mb-4">
                <input type="text" placeholder="Enter city name" class="form-control w-50" id="cityname">
                <button class="btn btn-primary mx-2" onclick="getweatherdetails()">Search</button>
            </div>

            <div class="card mx-auto shadow-sm" style="width: 18rem;" id="result">
            </div>
        </div>
    </div>

    <script>
        async function getweatherdetails()
        {
            try
            {
                const city = document.getElementById("cityname").value;

                const weatherdetails = await fetch(
                    `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=8ac5c4d57ba6a4b3dfcf622700447b1e&units=metric`
                );

                const weather = await weatherdetails.json();

                document.getElementById("result").innerHTML =
                `
                    <div class="card-body text-center">
                        <h3 class="text-primary">${weather.name}</h3>

                        <h1 class="my-3">
                            ${weather.main.temp}°C
                        </h1>

                        <hr>

                        <p class="mb-2">
                            Humidity: ${weather.main.humidity}%
                        </p>

                        <p class="mb-2">
                            Wind: ${(weather.wind.speed * 3.6).toFixed(1)} km/h
                        </p>

                        <p class="mb-0">
                            Weather: ${weather.weather[0].description}
                        </p>
                    </div>
                `;
            }
            catch(error)
            {
                console.log(error);
            }
        }
    </script>
</body>
</html>
